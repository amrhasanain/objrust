# Cargo.toml — Objective-Rust transpiler package.

[package]
name = "objective-rust"
version = "1.0.0"
edition = "2021"
description = "A Rust source-to-source transpiler with class-style syntax"
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/amrhasanain/objrust"
keywords = ["transpiler", "compiler", "classes", "language"]
categories = ["development-tools", "compilers"]

[lib]
name = "objective_rust"
path = "src/lib.rs"

[[bin]]
name = "objrust"
path = "src/main.rs"
